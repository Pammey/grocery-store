<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - FreshDirect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Paste the full <style> block from the previous combined template here */
        :root {--primary-color: #28a745; --secondary-color: #6c757d; --light-gray: #f8f9fa; --text-dark: #343a40; --font-family: 'Poppins', sans-serif;}
        body {font-family: var(--font-family); background-color: var(--light-gray); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;}
        .account-container {max-width: 900px; width: 100%; background-color: white; border-radius: 1rem; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1); overflow: hidden;}
        .branding-panel {background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1610348725531-843dff241197?q=80&w=1974&auto=format&fit=crop') no-repeat center center; background-size: cover; color: white; display: flex; flex-direction: column; justify-content: center; padding: 3rem;}
        .branding-panel h1 {font-weight: 700;}
        .form-panel {padding: 3rem;}
        .navbar-brand {font-weight: 700; color: var(--primary-color) !important; font-size: 1.5rem;}
        .form-control:focus {border-color: var(--primary-color); box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.25);}
        .btn-primary {background-color: var(--primary-color); border-color: var(--primary-color); padding: 0.75rem; font-weight: 600;}
        .btn-primary:hover {background-color: #218838; border-color: #1e7e34;}
        .social-divider {display: flex; align-items: center; text-align: center; color: var(--secondary-color); font-size: 0.9rem;}
        .social-divider::before, .social-divider::after {content: ''; flex: 1; border-bottom: 1px solid #dee2e6;}
        .social-divider:not(:empty)::before {margin-right: .25em;}
        .social-divider:not(:empty)::after {margin-left: .25em;}
        .btn-social {font-weight: 500; border: 1px solid #dee2e6;}
        .btn-social i {margin-right: 0.5rem;}
    </style>
</head>
<body>
    <div class="account-container">
        <div class="row g-0">
            <div class="col-lg-6 d-none d-lg-block">
                <div class="branding-panel h-100">
                    <h1>{% block branding_title %}{% endblock %}</h1>
                    <p class="lead">{% block branding_subtitle %}{% endblock %}</p>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="form-panel">
                    <div class="text-center mb-4">
                        <a class="navbar-brand" href="{% url 'home' %}"> <i class="bi bi-basket2-fill"></i> FreshDirect
                        </a>
                    </div>
                    {% block form_content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
